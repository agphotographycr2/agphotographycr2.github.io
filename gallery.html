<html>
<title>AGPhotography</title>
<link href="https://fonts.googleapis.com/css?family=Pacifico" rel="stylesheet">
<style>
	*::selection {
		background-color: #00bbff88;
	}
	.social_logo {
		filter: grayscale(50%);
		margin-top: 5px;
		margin-bottom: 0px;
		cursor: hand;
		transition-duration: .2s;
	}
	.social_logo:hover {
		filter: grayscale(0%);
		margin-top: 0px;
		margin-bottom: 5px;
	}
</style>
<body style="background-color: black">
	<h1 id="top_text" style="color: white; font-family: Pacifico; font-size: 50pt; font-weight: 100; text-align: center; width: 100%; padding-top: 30px">agphotography</h1>
	<div id="social_media_grid" style="width: 15%; margin-left: 43%; justify-content: center">
		<a><image class="social_logo" src="images/instagram.png" style="width: 25%; margin-left: 3%; margin-right: 3%"></image></a>
		<a><image class="social_logo" src="images/facebook.png" style="width: 25%; margin-left: 3%; margin-right: 3%"></image></a>
		<a><image class="social_logo" src="images/pinterest.png" style="width: 25%; margin-left: 3%; margin-right: 3%"></image></a>
	</div>
	<h2 id="location_text" style="color: white; font-family: Geogria; font-size: 32pt; font-weight: 100; text-align: center; width: 10%; margin-left: 25%; padding: 15px; padding-top: 0px; border: 1px solid white">Gallery:</h2>
	<div id="gallery_holder" style="width: 46%; margin-left: 25%">
		<image src="images/gallery/building_2.jpeg" style="position: relative; top: 0px; left: 0px; width: 10vw; height: 20vw; object-fit: cover; vertical-align: top"></image>
		<image src="images/gallery/ford_focus.jpeg" style="position: relative; top: 0px; left: 10px; width: 10vw; height: 20vw; object-fit: cover; vertical-align: top"></image>
		<image src="images/gallery/bmw.jpeg" style="position: relative; top: 0px; left: 20px; width: 20vw; height: 20vw; object-fit: cover; vertical-align: top"></image>
		<image src="images/gallery/ford_mountune.jpeg" style="position: relative; top: 10px; left: 0px; width: 10vw; height: 10vw; object-fit: cover; vertical-align: top"></image>
		<image src="images/gallery/building_4.jpeg" style="position: relative; top: 10px; left: 10px; width: 10vw; height: 15vw; object-fit: cover; vertical-align: top"></image>
		<image src="images/gallery/sub_1.jpeg" style="position: relative; top: 10px; left: 20px; width: 20vw; height: 11vw; object-fit: cover; vertical-align: top"></image>
		<image src="images/gallery/building_1.jpeg" style="position: relative; top: -55px; left: 0px; width: 8vw; height: 16vw; object-fit: cover; vertical-align: top"></image>
		<image src="images/gallery/flower.jpeg" style="position: relative; top: 40px; left: 10px; width: 10vw; height: 8vw; object-fit: cover; vertical-align: top"></image>
		<image src="images/gallery/tractor.jpeg" style="position: relative; top: 40px; left: 10px; width: 10vw; height: 8vw; object-fit: cover; vertical-align: top"></image>
		<image src="images/gallery/van.jpeg" style="position: relative; top: -40px; left: 10px; width: 12vw; height: 10vw; object-fit: cover; vertical-align: top"></image>
		<image src="images/gallery/building_3.jpeg" style="position: relative; top: -40px; left: 0px; width: 9vw; height: 14vw; object-fit: cover; vertical-align: top"></image>
		<image src="images/gallery/daf.jpeg" style="position: relative; top: -20px; left: 20px; width: 20vw; height: 14vw; object-fit: cover; vertical-align: top"></image>
		<image src="images/gallery/sub_2.jpeg" style="position: relative; top: -125px; left: 30px; width: 10vw; height: 20vw; object-fit: cover; vertical-align: top"></image>
	</div>
	<div style="border: 1px solid white; width: 25%; margin-left: 37%; margin-top: 20px; margin-bottom: 20px; padding-bottom: 0px"><p style="color: white; font-family: Georgia; font-size: 16pt; font-weight: 100; text-align: center; vertical-align: top; padding: 15px; margin: 0px; width: 100%">2026 agphotography</p></div>
	<script>
		function update_window() {
			if (window.outerWidth < window.outerHeight) {
				document.getElementById("top_text").style.fontSize = "80pt";
				document.getElementById("location_text").style.fontSize = "40pt";
				document.getElementById("location_text").style.width = "50%";
				document.getElementById("gallery_holder").style.marginTop = "50%";
				document.getElementById("gallery_holder").style.marginLeft = "25%";
				document.getElementById("gallery_holder").style.scale = 2;
			}
		}
		setTimeout(update_window, 100);
	</script>
</body>
</html>
